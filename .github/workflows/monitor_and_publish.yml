name: API Performance Monitor & Periodic Updater

on:
  schedule:
    # Run periodically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  probe-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database & Probe Endpoints
        run: |
          python cli.py init-db
          python cli.py probe
          python cli.py insights

      - name: Export Fresh Data Stream
        run: |
          python cli.py export

      - name: Commit & Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/metrics.csv
          if git diff --staged --quiet; then
            echo "No performance metric changes to commit."
          else
            git commit -m "chore(metrics): automated api probe sync [skip ci]"
            git push
          fi
